name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup component add clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release
