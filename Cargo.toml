[package]
name = "snapframe"
version = "0.1.0"
edition = "2024"
description = "A tray window that holds other apps' windows so Windows Snap moves them as one"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/danyoks/snapframe"
publish = false

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
